# digest-rules.yaml — p2 首版（LG-035 首条实证线；CEO 23:56 批两精化在案）
# 大纲位必填缺位 → reject 记日志（阀门首实证）
# type 分流：discipline → 手册对应节 / experience → 席经验页（分席页）
version: p2-first-line
inboxRoot: knowledge/org/inbox
outlineSource: knowledge/org/inbox/org-discipline-handbook-v1-seed.md
targets:
  disciplineHandbook: knowledge/org/discipline-handbook.md
  experienceIndex: knowledge/org/experience-index.md
  experiencePages: knowledge/org/experiences/
rules:
  - match:
      sourceType: discipline
    target: disciplineHandbook
    required:
      - outlineSlot
    action: append-to-outline-slot
  - match:
      sourceType: experience
    target: experienceIndex
    required:
      - domain
    action: append-to-experience-library
rejectLog: knowledge/org/digest-reject.log
