# ── TriCade Production Build Pipeline ──
# Triggered by version tags (v*), this workflow:
#   1. Checks out TriLC + TriPilot + TriCode + TriMC + TriModel (sibling repos)
#   2. npm ci + tsc for each
#   3. Packages TriPilot .vsix extension
#   4. Assembles staging directory
#   5. Optionally builds WiX MSI installer
#   6. Creates GitHub Release with artifacts
#
# CTO-008-P compatible. Output mirrors build-desktop.ps1 structure.

name: Build TriCade

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version string (e.g. 2026.08.05.1)'
        required: false
        type: string
      revision:
        description: 'Same-day revision number (default 1)'
        required: false
        type: number
        default: 1
      build_msi:
        description: 'Build WiX MSI installer (requires WiX Toolset v3 on runner)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build TriCade (${{ github.ref_name }})
    runs-on: windows-latest

    env:
      VERSION_PREFIX: ${{ inputs.version || 'calver' }}
      REVISION: ${{ inputs.revision || '1' }}

    steps:
      # ── Compute version (calver: YYYY.M.D.N or inputs.version) ──
      # VERSION = display/file name version (full year, e.g. 2026.08.05.1)
      # MSI_VERSION = WiX-compatible (major<256, year-2000, e.g. 26.08.05.1)
      - name: Compute version
        id: version
        run: |
          if ("$env:VERSION_PREFIX" -ne "calver") {
            $v = "$env:VERSION_PREFIX"
            $mv = ($v -split '\.')
            $mv[0] = [string]([int]$mv[0] - 2000)
            $msiV = ($mv -join '.')
          } else {
            $d = Get-Date
            $rev = "$env:REVISION"
            if ([string]::IsNullOrEmpty($rev) -or $rev -eq "1") {
              # Auto-count: today's build number = today's successful runs + 1
              $today = $d.ToString("yyyy-MM-dd")
              try {
                $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN"; "X-GitHub-Api-Version" = "2022-11-28" }
                $runs = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs?created=$today&status=success" -Headers $headers
                $rev = [string]($runs.total_count + 1)
              } catch {
                $rev = "1"
              }
            }
            $mm = $d.Month.ToString("00")
            $dd = $d.Day.ToString("00")
            $v = "$($d.Year).$mm.$dd.$rev"
            $msiV = "$($d.Year - 2000).$mm.$dd.$rev"
          }
          echo "VERSION=$v" >> $env:GITHUB_ENV
          echo "MSI_VERSION=$msiV" >> $env:GITHUB_ENV
          Write-Host "VERSION=$v (MSI: $msiV)"

      # ── Checkout sibling repositories ──
      - name: Checkout TriMetaverse (build scripts)
        uses: actions/checkout@v4
        with:
          path: TriMetaverse
          ref: ${{ github.ref }}

      - name: Checkout TriLC
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TriLC
          path: TriLC
          ref: ${{ github.ref }}

      - name: Checkout TriPilot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TriPilot
          path: TriPilot
          ref: ${{ github.ref }}

      - name: Checkout TriCode
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TriCode
          path: TriCode
          ref: ${{ github.ref }}

      - name: Checkout TriMC
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TriMC
          path: TriMC
          ref: ${{ github.ref }}

      - name: Checkout TriModel
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TriModel
          path: TriModel
          ref: ${{ github.ref }}

      - name: Checkout TriCompany
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/TriCompany
          path: TriCompany
          ref: ${{ github.ref }}

      # ── Node.js setup ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            TriLC/package-lock.json
            TriPilot/package-lock.json
            TriCode/package-lock.json
            TriMC/package-lock.json
            TriModel/package-lock.json

      # ── Build TriModel (no deps; needed by TriMC + TriLC) ──
      - name: Build TriModel
        working-directory: TriModel
        run: |
          npm ci
          npx tsc -p tsconfig.json --outDir dist

      # ── Build TriMC agent-core (depends on TriModel) ──
      - name: Build TriMC agent-core
        working-directory: TriMC/packages/agent-core
        run: |
          npm ci
          npx tsc -p tsconfig.json --outDir dist

      # ── Build TriCode ──
      - name: Build TriCode
        working-directory: TriCode
        run: |
          npm ci
          npx tsc -p tsconfig.json --outDir dist

      # ── Build TriLC ──
      - name: Build TriLC
        working-directory: TriLC
        run: |
          npm ci
          npx tsc -p tsconfig.json --outDir dist
          npx tsc -p tsconfig.json --noEmit

      # ── Build TriPilot ──
      - name: Build TriPilot
        working-directory: TriPilot
        run: |
          npm ci
          npx tsc -p tsconfig.json --outDir out

      # ── Package TriPilot extension ──
      - name: Package TriPilot .vsix
        working-directory: TriPilot
        run: |
          npx vsce package --no-dependencies --allow-missing-repository
          $vsixFile = Get-ChildItem *.vsix | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          echo "VSIX_PATH=$($vsixFile.FullName)" >> $env:GITHUB_ENV
          echo "VSIX_NAME=$($vsixFile.Name)" >> $env:GITHUB_ENV

      # ── Assemble staging directory ──
      - name: Assemble staging
        run: |
          $staging = "staging\TriCade-$env:VERSION-windows"
          New-Item -ItemType Directory -Force -Path "$staging\extensions" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging\trilc"      | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging\tri-code"   | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging\config"     | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging\scripts"    | Out-Null

          # TriLC
          Copy-Item -Recurse -Force TriLC\dist         "$staging\trilc\"
          Copy-Item -Recurse -Force TriLC\node_modules  "$staging\trilc\"
          if (-not (Test-Path "$staging\trilc\node_modules")) {
            Write-Error "FATAL: TriLC node_modules copy failed — path does not exist"
            exit 1
          }
          Copy-Item -Force       TriLC\package.json     "$staging\trilc\"
          # version.json 随构建版本更新（BUG-20260805-002 修复）：注入 CI calver
          @{ version = "$env:VERSION" } | ConvertTo-Json -Compress | Set-Content "$staging\trilc\version.json" -Encoding UTF8

          # Contracts for installed-state (4.2 安装态): <trilc-root>\contracts
          # = TriCompany/source-agents (v2 contracts + five-piece) + employee-roster
          Copy-Item -Recurse -Force TriCompany\source-agents "$staging\trilc\contracts\"
          New-Item -ItemType Directory -Force -Path "$staging\trilc\contracts\docs\registry" | Out-Null
          Copy-Item -Force TriCompany\docs\registry\employee-roster.json "$staging\trilc\contracts\docs\registry\employee-roster.json"
          if (-not (Test-Path "$staging\trilc\contracts\docs\registry\employee-roster.json")) {
            Write-Error "FATAL: contracts/roster copy failed"
            exit 1
          }

          # trilc.cmd — deterministic CLI entry (node detection + path-relative)
          # NOTE: in PowerShell here-string "%" is literal (no escaping needed).
          #       batch file rules: for-var needs "%%i", var ref needs "%VAR%" (single %).
          #       YAML block scalar strips common indent; here-string content must be indented to stay in block
          $trilcCmd = @"
          @echo off
          setlocal
          set "NODE_EXE="
          for /f "delims=" %%i in ('where node 2^>nul') do if not defined NODE_EXE set "NODE_EXE=%%i"
          if not defined NODE_EXE (
            echo [trilc] ERROR: Node.js not found on PATH. Install Node.js 20+ first.
            exit /b 1
          )
          "%NODE_EXE%" "%~dp0dist\cli.js" %*
          endlocal
          "@
          Set-Content -Path "$staging\trilc\trilc.cmd" -Value $trilcCmd -Encoding ASCII
          if (-not (Test-Path "$staging\trilc\trilc.cmd")) {
            Write-Error "FATAL: trilc.cmd generation failed"
            exit 1
          }

          # TriCode
          Copy-Item -Recurse -Force TriCode\dist         "$staging\tri-code\"
          Copy-Item -Recurse -Force TriCode\node_modules  "$staging\tri-code\"
          if (-not (Test-Path "$staging\tri-code\node_modules")) {
            Write-Error "FATAL: TriCode node_modules copy failed — path does not exist"
            exit 1
          }
          Copy-Item -Force       TriCode\package.json     "$staging\tri-code\"

          # TriPilot .vsix extraction
          $extDir = "$staging\extensions\tripilot-chat-0.0.1"
          New-Item -ItemType Directory -Force -Path $extDir | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($env:VSIX_PATH, $extDir)

          # Config (optional — TriLC falls back to built-in defaults if missing)
          # Config (optional — create default if missing)
          if (Test-Path TriMetaverse\config\settings.json) {
            Copy-Item -Force TriMetaverse\config\settings.json "$staging\config\"
          } else {
            @{ triLC = @{ port = 8711 }; version = "$env:VERSION" } | ConvertTo-Json | Set-Content "$staging\config\settings.json"
          }

          # Install script
          $installBat = @"
          @echo off
          setlocal
          echo ========================================
          echo  TriCade Desktop Installer $env:VERSION
          echo ========================================
          echo.
          echo TriLC Local Controller + TriPilot Extension
          echo.
          echo [1/2] Installing TriPilot extension...
          code --install-extension "%%~dp0..\extensions\tripilot-chat-0.0.1" --force
          echo [2/2] Installation complete!
          echo.
          echo Start with: trilc daemon start
          endlocal
          "@
          Set-Content -Path "$staging\scripts\install.bat" -Value $installBat -Encoding ASCII
          echo "STAGING_DIR=$staging" >> $env:GITHUB_ENV

      # ── Create distribution ZIP ──
      - name: Create ZIP artifact
        id: zip
        run: |
          $zipFile = "TriCade-$env:VERSION-windows.zip"
          Compress-Archive -Force -Path "$env:STAGING_DIR\*" -DestinationPath $zipFile
          echo "zip_file=$zipFile" >> $env:GITHUB_OUTPUT

      # ── WiX MSI Installer (requires WiX Toolset v3) ──
      # Enable via workflow_dispatch input `build_msi: true`, or set
      # `env.BUILD_MSI = 'true'` for tag-triggered builds in repo variables.
      - name: Setup WiX Toolset
        if: inputs.build_msi == true || vars.BUILD_MSI == 'true'
        run: |
          choco install wixtoolset -y
          echo "WIX_DIR=${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" >> $env:GITHUB_ENV

      - name: Build WiX MSI
        id: msi
        if: inputs.build_msi == true || vars.BUILD_MSI == 'true'
        run: |
          & "$env:WIX_DIR\heat.exe" dir "$env:STAGING_DIR" -dr INSTALLFOLDER -cg TriCadeComponents -gg -sfrag -srd -out TriCade-files.wxs
          & "$env:WIX_DIR\candle.exe" TriMetaverse\installer\tricade.wxs TriCade-files.wxs -dVersion="$env:MSI_VERSION"
          $msiFile = "TriCade-$env:VERSION-windows.msi"
          & "$env:WIX_DIR\light.exe" tricade.wixobj TriCade-files.wixobj -ext WixUIExtension -b "$env:STAGING_DIR" -sice:ICE80 -out $msiFile
          echo "msi_file=$msiFile" >> $env:GITHUB_OUTPUT

      # ── Upload artifacts ──
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriCade-${{ env.VERSION }}-windows.zip
          path: ${{ steps.zip.outputs.zip_file }}

      - name: Upload MSI artifact
        if: inputs.build_msi == true || vars.BUILD_MSI == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TriCade-${{ env.VERSION }}-windows.msi
          path: ${{ steps.msi.outputs.msi_file }}

      # ── GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TriCade ${{ env.VERSION }}
          body: |
            ## TriCade ${{ env.VERSION }}

            TriMetaverse Desktop distribution bundle.

            ### Contents
            - **TriLC** — Local Controller daemon (HTTP + SSE agent loop)
            - **TriPilot** — Chat extension for VSCodium/VS Code
            - **TriCode** — Shared code runtime

            ### Installation
            1. Download `TriCade-${{ env.VERSION }}-windows.zip`
            2. Extract to your workspace
            3. Run `scripts\install.bat` or manually install the extension
            4. Start daemon: `trilc daemon start`

            ### Build Information
            - Build SHA: ${{ github.sha }}
            - Runner: windows-latest
            - Node.js: 20.x

            ---
            Generated with TriCade CI/CD Pipeline
          files: |
            ${{ steps.zip.outputs.zip_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
